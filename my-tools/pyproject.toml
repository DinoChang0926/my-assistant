[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "my-tools"
version = "0.1.0"
description = "Independent tool package for AI Agent — atomic tools, MCP server (Phase 2)"
requires-python = ">=3.11"

# Tool-specific dependencies (separated from main assistant)
dependencies = [
    "requests>=2.31.0",
    "beautifulsoup4>=4.12.0",
    "duckduckgo-search>=3.9.0",
    "google-api-python-client>=2.100.0",
    "google-auth-oauthlib>=1.1.0",
    "python-telegram-bot>=20.0",
    "pydantic>=2.0",
]

[project.optional-dependencies]
mcp = [
    "mcp>=1.0.0",  # Phase 2: MCP server/client
]

[tool.setuptools.packages.find]
where = ["."]
include = ["atomic*"]
